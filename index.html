<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About X-LeeHe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="fallback-bg"></div>
    <img id="bg-canvas" src="./assets/background.png" alt="Background" crossorigin="anonymous">
    
    <main class="container">
        <div class="profile-section">
            <img src="./assets/avatar.jpg" class="avatar" alt="User">
            
            <p class="centered">Hi, I am</p>
            <h1>X-LeeHe</h1>
            <p class="bio">警惕赛博杂食性动物</p>

            <div class="tags">
                <div class="tag">ArchLinuxUser</div>
                <div class="tag">Mild DIY enthusiast</div>
                <div class="tag">Robotics (idiot)</div>
                <div class="tag">Minecraft</div>
                <div class="tag">Helldivers 2</div>
            </div>
        </div>

        <nav class="nav-section">
            <a href="https://github.com/x-leehe" class="link-card">
                <span class="material-symbols-outlined">code</span>
                <div class="link-text">Github</div>
                <span class="material-symbols-outlined">chevron_right</span>
            </a>
            <a href="#" class="link-card">
                <span class="material-symbols-outlined">web</span>
                <div class="link-text">Blog</div>
                <span class="material-symbols-outlined">chevron_right</span>
            </a>
            <div class="dropdown">
                <div class="link-card dropdown-trigger">
                    <span class="material-symbols-outlined">scatter_plot</span>
                    <div class="link-text">More</div>
                    <span class="material-symbols-outlined arrow">expand_more</span>
                </div>
                <div class="dropdown-content">
                    <a href="https://t.me/about_leehe" class="dropdown-item">
                        <span class="material-symbols-outlined">send</span>
                        <span>TeleGram</span>
                    </a>
                    <a href="mailto:x-leehe@outlook.com" class="dropdown-item">
                        <span class="material-symbols-outlined">mail</span>
                        <span>Mail</span>
                    </a>
                    <a href="https://steamcommunity.com/id/yourid" class="dropdown-item">
                        <span class="material-symbols-outlined">sports_esports</span>
                        <span>Steam</span>
                    </a>
                </div>
            </div>
                <div class="dropdown music-dropdown">
                <div class="link-card dropdown-trigger">
                    <span class="material-symbols-outlined">music_note</span>
                    <div class="link-text">Music (From NetEase)</div>
                    <span class="material-symbols-outlined arrow">expand_more</span>
                </div>
                <div class="dropdown-content">
                    <!-- require APlayer -->
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
                    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
                    <!-- require MetingJS -->
                    <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>

                    <meting-js
                        server="netease"
                        type="playlist"
                        id="912199427"
                        api="https://api.injahow.cn/meting/?server=:server&type=:type&id=:id&r=:r"
                        list-folded="true">
                    </meting-js>
                </div>
            </div>
        </nav>

    </main>

    <script src="js/script.js"></script>
    
</body>
</html>
